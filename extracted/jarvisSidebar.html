<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS — Sidebar</title>
  <!-- CSS JARVIS dimuat secara statik supaya panel sentiasa bergaya walaupun
       injeksi <link> dari jarvisSidebar.js gagal (jarvisOverlay.css diperlukan
       untuk paparan header/input/transkrip). -->
  <link rel="stylesheet" href="styles/jarvisOverlay.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    /* JARVIS host memenuhi seluruh panel sidebar */
    #lp-jarvis-root.lp-jarvis-host {
      position: static !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      /* Gunakan 100% (bukan 100vh) supaya ikut ketinggian body yang sudah
         100% — elak konflik dengan bar alat sidebar Firefox & observer saiz. */
      width: 100% !important;
      height: 100% !important;
      transform: none !important;
      min-width: 240px !important;
      min-height: 200px !important;
      max-width: none !important;
      max-height: none !important;
      overflow: hidden !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      z-index: auto !important;
      /* Mesti papar secara eksplisit: peraturan asas #lp-jarvis-root ada
         "display: none" (hanya nampak bila .lp-jarvis-open). Dalam host ini
         panel sentiasa terbuka, jadi paksa display:flex dengan !important
         supaya ia menang ke atas "display:none" asas (keutamaan CSS). */
      display: flex !important;
    }
    /* Penunjuk "loading" dipaparkan sebaik sahaja halaman dimuat, dan dibuang
       oleh jarvisOverlay.js bila panel berjaya dibina (atau diganti mesej
       ralat). Mengelak panel kelihatan "kosong" semasa bina. */
    #lp-jarvis-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aab4d4;
      font: 13px/1.5 system-ui, sans-serif;
      background: #1a1a2e;
      z-index: 1;
    }
    /* Sembunyi kawalan terapung yang tak relevan dalam sidebar (kecuali
       butang flip #lp-jarvis-mode-toggle — ia perlu kekal untuk flip balik
       ke overlay). */
    #lp-jarvis-pin,
    #lp-jarvis-close,
    #lp-jarvis-resize {
      display: none !important;
    }
    #lp-jarvis-root.lp-jarvis-host .lp-jarvis-header {
      cursor: default !important;
    }
  </style>
</head>
<body>
  <!-- Loading state: dipaparkan serta-merta, dibuang oleh jarvisSidebar.js
       bila panel berjaya dibina. Jika bina gagal, mesej ralat menggantinya. -->
  <div id="lp-jarvis-boot">Memuatkan JARVIS…</div>
  <script src="lib/dompurify.min.js"></script>
  <script src="core/summaryPromptCore.js"></script>
  <script src="core/preferenceLearner.js"></script>
  <script src="core/preferenceSync.js"></script>
  <script src="core/memoryLayers.js"></script>
  <script src="core/memoryExtractor.js"></script>
  <script src="core/proactiveEngine.js"></script>
  <script src="proactiveIndicator.js"></script>
  <script src="core/jarvisCore.js"></script>
  <script src="core/markdownLight.js"></script>
  <script src="core/macroValidator.js"></script>
  <script src="core/macroEngine.js"></script>
  <script src="core/macroScheduler.js"></script>
  <script src="automationStudio.js"></script>
  <script src="core/selectionSearchShared.js"></script>
  <script src="core/jarvisCacheCore.js"></script>
  <script src="jarvisSidebar.js"></script>
</body>
</html>
